<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Avatar Twin · M2 验收</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #1f2329; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin: 24px 0 8px; }
  .card { background: #fff; border: 1px solid #e5e6eb; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  input[type=text], input[type=password], textarea, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; margin: 4px 0; }
  textarea { min-height: 90px; font-family: inherit; }
  button { padding: 9px 16px; border: none; border-radius: 8px; background: #1f6feb; color: #fff; font-size: 14px; cursor: pointer; margin: 4px 4px 0 0; }
  button:disabled { background: #b8c4d4; cursor: not-allowed; }
  button.ghost { background: #eef1f5; color: #1f2329; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: #8a919f; font-size: 13px; }
  .tag { display: inline-block; background: #eef1f5; border-radius: 12px; padding: 2px 10px; font-size: 12px; margin: 2px 4px 2px 0; }
  .risk { color: #c0392b; } .score { font-weight: 600; }
  .list-item { border: 1px solid #e5e6eb; border-radius: 8px; padding: 10px; margin: 8px 0; }
  .list-item.sel { border-color: #1f6feb; background: #f4f8ff; }
  .err { color: #c0392b; background: #fdf0ef; border-radius: 8px; padding: 10px; margin-top: 8px; display: none; }
  #stream { white-space: pre-wrap; background: #fafbfc; border: 1px solid #e5e6eb; border-radius: 8px; padding: 12px; max-height: 220px; overflow: auto; font-size: 13px; display: none; }
  .hidden { display: none; }
  label { font-size: 13px; color: #4b5563; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Avatar Twin · M2 账户与信息源验收</h1>

  <!-- 登录 -->
  <div class="card" id="loginCard">
    <h2>登录</h2>
    <div class="row">
      <input type="text" id="phone" placeholder="手机号（测试环境任意 6-20 位数字）" style="flex:1">
      <button id="btnCode">获取验证码</button>
    </div>
    <div class="muted" id="codeHint"></div>
    <div class="row">
      <input type="text" id="code" placeholder="验证码" style="flex:1">
      <button id="btnLogin">登录</button>
    </div>
  </div>

  <!-- 工作区 -->
  <div id="workspace" class="hidden">
    <div class="row">
      <span id="meInfo" class="muted"></span>
      <button class="ghost" id="btnLogout">退出登录</button>
    </div>

    <div class="card">
      <h2>① 项目</h2>
      <div class="row"><input type="text" id="projName" placeholder="项目名称" style="max-width:240px"><button id="btnProj">新建项目</button></div>
      <div id="projList"></div>
    </div>

    <div class="card">
      <h2>② 数字人 Profile（当前项目）</h2>
      <div class="row">
        <input type="text" id="profName" placeholder="数字人名称" style="max-width:180px">
        <input type="text" id="profStyle" placeholder="表达风格，逗号分隔" style="max-width:220px">
        <input type="text" id="profTopics" placeholder="内容方向，逗号分隔" style="max-width:220px">
        <input type="text" id="profCatch" placeholder="口头禅，逗号分隔" style="max-width:180px">
        <input type="text" id="profBanned" placeholder="禁用词，逗号分隔" style="max-width:180px">
        <button id="btnProf">新建 Profile</button>
      </div>
      <div id="profList"></div>
    </div>

    <div class="card">
      <h2>③ 信息源（当前项目）</h2>
      <div class="row">
        <select id="srcType">
          <option value="url">网页 URL</option>
          <option value="rss">RSS 订阅</option>
          <option value="manual">手动文本</option>
        </select>
        <input type="text" id="srcUrl" placeholder="链接（URL/RSS）" style="flex:1">
      </div>
      <textarea id="srcContent" placeholder="手动文本正文（仅手动类型需要）"></textarea>
      <div class="row"><button id="btnSrc">添加信息源</button></div>
      <div id="srcList"></div>
    </div>

    <div class="card">
      <h2>④ 抓取条目</h2>
      <div class="row"><button class="ghost" id="btnItems">刷新条目</button></div>
      <div id="itemList"></div>
    </div>

    <div class="card">
      <h2>⑤ 选题 & 脚本</h2>
      <div id="topicList"></div>
      <div id="stream"></div>
      <div id="scriptArea"></div>
    </div>

    <div class="card">
      <h2>⑥ 我的视频</h2>
      <div class="row"><button class="ghost" id="btnVideos">刷新视频列表</button></div>
      <div id="videoList"></div>
    </div>
  </div>

  <div class="err" id="err"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem('avt_token') || '';
let currentProject = null, currentItem = null, currentTopic = null, currentScript = null;

function showErr(msg) { const e = $('err'); e.textContent = msg; e.style.display = 'block'; }
function clearErr() { $('err').style.display = 'none'; }

function headers() { return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' }; }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
  let data = null; try { data = await res.json(); } catch (_) {}
  if (!res.ok) { throw new Error(data && data.error ? data.error.message : ('HTTP ' + res.status)); }
  return data;
}

function split(v) { return (v || '').split(/[,，]/).map(s => s.trim()).filter(Boolean); }

// ---------- 登录 ----------
$('btnCode').onclick = async () => {
  clearErr();
  try { const r = await api('/api/v1/auth/code', { method: 'POST', body: JSON.stringify({ phone: $('phone').value.trim() }) });
    $('codeHint').textContent = r.dev_code ? ('测试环境验证码：' + r.dev_code) : '验证码已发送';
  } catch (e) { showErr(e.message); }
};
$('btnLogin').onclick = async () => {
  clearErr();
  try { const r = await api('/api/v1/auth/verify', { method: 'POST', body: JSON.stringify({ phone: $('phone').value.trim(), code: $('code').value.trim() }) });
    token = r.token; localStorage.setItem('avt_token', token);
    $('loginCard').classList.add('hidden'); $('workspace').classList.remove('hidden');
    $('meInfo').textContent = '已登录：' + r.user.phone;
    await refreshProjects(); refreshVideos().catch(()=>{});
  } catch (e) { showErr(e.message); }
};
$('btnLogout').onclick = async () => {
  await api('/api/v1/auth/logout', { method: 'POST' }).catch(() => {});
  token = ''; localStorage.removeItem('avt_token'); location.reload();
};

// ---------- 项目 ----------
async function refreshProjects() {
  const list = await api('/api/v1/projects');
  // 自动选中第一个项目（否则 Profile/信息源无法操作）
  if (!currentProject && list.length > 0) {
    currentProject = list[0];
    refreshProfiles(); refreshSources(); refreshItems();
  }
  $('projList').innerHTML = '';
  list.forEach(p => {
    const d = document.createElement('div');
    d.className = 'list-item' + (currentProject && currentProject.id === p.id ? ' sel' : '');
    d.innerHTML = '<b>' + p.name + '</b> <button class="selproj" data-id="' + p.id + '">切换</button>';
    $('projList').appendChild(d);
  });
  document.querySelectorAll('button.selproj').forEach(b => b.onclick = () => {
    currentProject = list.find(p => p.id === b.dataset.id);
    refreshProjects(); refreshProfiles(); refreshSources(); refreshItems();
  });
}
$('btnProj').onclick = async () => {
  clearErr();
  try { const p = await api('/api/v1/projects', { method: 'POST', body: JSON.stringify({ name: $('projName').value.trim() }) });
    currentProject = p; $('projName').value = ''; await refreshProjects();
  } catch (e) { showErr(e.message); }
};

// ---------- Profile ----------
async function refreshProfiles() {
  if (!currentProject) return;
  const list = await api('/api/v1/projects/' + currentProject.id + '/profiles');
  $('profList').innerHTML = list.length ? '' : '<div class="muted">（暂无 Profile，脚本会用默认人设）</div>';
  list.forEach(p => {
    const d = document.createElement('div');
    d.className = 'list-item';
    d.innerHTML = '<b>' + p.name + '</b> <span class="tag">' + p.language + '</span><span class="tag">' + (p.style_tags || []).join('、') + '</span>' +
      (p.avatar_type === 'uploaded_self' ? '<span class="tag">已上传本人照片</span>' : '') +
      '<div class="muted">方向：' + (p.topic_preferences || []).join('、') + '｜禁用：' + (p.banned_phrases || []).join('、') + '</div>' +
      '<div class="row"><input type="file" id="photo-' + p.id + '" accept="image/jpeg,image/png,image/webp" style="max-width:220px">' +
      '<label style="font-size:12px"><input type="checkbox" id="consent-' + p.id + '"> 确认是本人形象并授权使用</label>' +
      '<button class="uploadphoto" data-id="' + p.id + '">上传照片</button></div>';
    $('profList').appendChild(d);
  });
  document.querySelectorAll('button.uploadphoto').forEach(b => b.onclick = async () => {
    clearErr();
    const pid = b.dataset.id;
    const fi = $('photo-' + pid);
    if (!fi.files.length) return showErr('请先选择照片文件');
    if (!$('consent-' + pid).checked) return showErr('请先勾选本人形象授权确认');
    const fd = new FormData();
    fd.append('file', fi.files[0]); fd.append('consent', 'true');
    try {
      const res = await fetch('/api/v1/profiles/' + pid + '/photo', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
      if (!res.ok) { const d = await res.json().catch(()=>{}); throw new Error(d && d.error ? d.error.message : '上传失败'); }
      await refreshProfiles();
    } catch (e) { showErr(e.message); }
  });
}
$('btnProf').onclick = async () => {
  clearErr();
  if (!currentProject) { showErr('请先在上面「① 项目」里新建一个项目（或点项目旁的「切换」），再建 Profile'); return; }
  try {
    await api('/api/v1/projects/' + currentProject.id + '/profiles', { method: 'POST', body: JSON.stringify({
      name: $('profName').value.trim(), style_tags: split($('profStyle').value),
      topic_preferences: split($('profTopics').value), catchphrases: split($('profCatch').value),
      banned_phrases: split($('profBanned').value), language: 'zh', avatar_type: 'template', voice_type: 'default_tts', video_ratio: '9:16', platform_preferences: ['douyin'],
    }) });
    ['profName','profStyle','profTopics','profCatch','profBanned'].forEach(id => $(id).value = '');
    await refreshProfiles();
  } catch (e) { showErr(e.message); }
};

// ---------- 信息源 ----------
async function refreshSources() {
  const list = await api('/api/v1/sources');
  $('srcList').innerHTML = '';
  list.forEach(s => {
    const d = document.createElement('div');
    d.className = 'list-item';
    d.innerHTML = '<b>[' + s.source_type + '] ' + (s.name || s.url) + '</b> <span class="tag">' + s.status + '</span>' +
      '<button class="fetch" data-id="' + s.id + '">抓取</button>';
    $('srcList').appendChild(d);
  });
  document.querySelectorAll('button.fetch').forEach(b => b.onclick = async () => {
    clearErr();
    try { const items = await api('/api/v1/sources/' + b.dataset.id + '/fetch', { method: 'POST' });
      alert('抓取到 ' + items.length + ' 条（去重后）'); await refreshItems();
    } catch (e) { showErr(e.message); }
  });
}
$('btnSrc').onclick = async () => {
  clearErr();
  if (!currentProject) return showErr('请先选择/新建项目');
  try {
    await api('/api/v1/sources', { method: 'POST', body: JSON.stringify({
      project_id: currentProject.id, source_type: $('srcType').value,
      url: $('srcUrl').value.trim(), content: $('srcContent').value.trim(),
    }) });
    $('srcUrl').value = ''; $('srcContent').value = ''; await refreshSources();
  } catch (e) { showErr(e.message); }
};

// ---------- 条目 ----------
async function refreshItems() {
  const list = await api('/api/v1/items');
  $('itemList').innerHTML = '';
  list.forEach(it => {
    const d = document.createElement('div');
    d.className = 'list-item' + (currentItem && currentItem.id === it.id ? ' sel' : '');
    d.innerHTML = '<b>' + (it.title || it.original_url) + '</b> <span class="tag">' + it.status + '</span>' +
      '<div class="muted">' + (it.summary || '（未摘要）') + '</div>' +
      '<button class="summ" data-id="' + it.id + '">摘要</button>' +
      '<button class="topics" data-id="' + it.id + '">生成选题</button>';
    $('itemList').appendChild(d);
  });
  document.querySelectorAll('button.summ').forEach(b => b.onclick = async () => {
    clearErr(); try { await api('/api/v1/items/' + b.dataset.id + '/summarize', { method: 'POST' }); await refreshItems(); } catch (e) { showErr(e.message); }
  });
  document.querySelectorAll('button.topics').forEach(b => b.onclick = async () => {
    clearErr();
    try { const topics = await api('/api/v1/items/' + b.dataset.id + '/topics', { method: 'POST' }); renderTopics(topics); } catch (e) { showErr(e.message); }
  });
}
$('btnItems').onclick = () => { clearErr(); refreshItems().catch(e => showErr(e.message)); };

// ---------- 选题 & 脚本 ----------
function renderTopics(topics) {
  $('topicList').innerHTML = '';
  topics.forEach(t => {
    const d = document.createElement('div');
    d.className = 'list-item';
    d.innerHTML = '<b>' + t.title + '</b> <span class="score">' + t.score + '</span> <span class="tag">' + t.risk_level + '</span>' +
      '<div class="muted">' + t.angle + '</div>' +
      (t.risk_flags && t.risk_flags.length ? '<div class="risk">风险：' + t.risk_flags.join('；') + '</div>' : '') +
      '<button class="selt" data-id="' + t.id + '">选这个→生成脚本</button>';
    $('topicList').appendChild(d);
  });
  document.querySelectorAll('button.selt').forEach(b => b.onclick = () => {
    currentTopic = b.dataset.id; $('scriptArea').innerHTML = ''; generateScript(currentTopic);
  });
}

async function generateScript(tid) {
  clearErr();
  $('stream').style.display = 'block'; $('stream').textContent = '正在生成脚本…\n';
  try {
    const res = await fetch('/api/v1/topics/' + tid + '/scripts', { method: 'POST', headers: headers() });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.trim(); if (!line.startsWith('data:')) continue;
        const payload = JSON.parse(line.slice(5));
        if (payload.delta !== undefined) $('stream').textContent += payload.delta;
        else if (payload.error) showErr(payload.error.message);
        else if (payload.script) { currentScript = payload.script.id; renderScript(payload.script); }
      }
    }
  } catch (e) { showErr(e.message); }
  finally { $('stream').style.display = 'none'; }
}

function renderScript(s) {
  $('scriptArea').innerHTML = '<div class="muted">版本 v' + s.version + '（' + s.duration_target + '秒 / ' + s.platform + ' / ' + s.language + '）</div>' +
    '<textarea id="scriptText">' + (s.content || '').replace(/</g, '&lt;') + '</textarea>' +
    '<div class="row"><button id="btnSave">保存新版本</button>' +
    '<button class="ghost" id="btnRevert">回退上一版</button>' +
    '<button id="btnVideo">生成视频</button>' +
    '<button class="ghost" id="btnExpMd">导出 MD</button>' +
    '<button class="ghost" id="btnExpTxt">导出 TXT</button></div>' +
    '<div id="videoArea"></div>' +
    (s.risk_flags && s.risk_flags.length ? '<div class="risk">风险：' + s.risk_flags.join('；') + '</div>' : '') +
    '<div class="muted">来源：' + (s.source_urls || []).join('；') + '</div>';
  $('btnSave').onclick = async () => {
    const updated = await api('/api/v1/scripts/' + currentScript, { method: 'PATCH', body: JSON.stringify({ content: $('scriptText').value }) });
    renderScript(updated);
  };
  $('btnRevert').onclick = async () => {
    const target = s.version > 1 ? s.version - 1 : 1;
    const updated = await api('/api/v1/scripts/' + currentScript + '/revert', { method: 'POST', body: JSON.stringify({ version: target }) });
    renderScript(updated);
  };
  $('btnExpMd').onclick = () => download('/api/v1/scripts/' + s.id + '/export?format=md', 'script.md').catch(e => showErr(e.message));
  $('btnExpTxt').onclick = () => download('/api/v1/scripts/' + s.id + '/export?format=txt', 'script.txt').catch(e => showErr(e.message));
  $('btnVideo').onclick = () => generateVideo(s.id);
}

async function download(path, filename) {
  const res = await fetch(path, { headers: headers() });
  if (!res.ok) { let d = null; try { d = await res.json(); } catch (_) {} throw new Error(d && d.error ? d.error.message : '下载失败'); }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function mediaUrl(path) {
  const res = await fetch(path, { headers: headers() });
  if (!res.ok) throw new Error('加载失败');
  const blob = await res.blob();
  return URL.createObjectURL(blob);
}

async function generateVideo(scriptId) {
  clearErr();
  $('videoArea').innerHTML = '<div class="muted">正在创建视频任务…</div>';
  try {
    const v = await api('/api/v1/scripts/' + scriptId + '/videos', { method: 'POST' });
    pollVideo(v.id);
  } catch (e) { showErr(e.message); }
}

async function pollVideo(vid) {
  try {
    const v = await api('/api/v1/videos/' + vid);
    if (v.status === 'success') {
      let src = '';
      try { src = await mediaUrl('/api/v1/videos/' + vid + '/file'); } catch (_) {}
      $('videoArea').innerHTML = '<div class="muted">✅ 视频生成成功</div>' +
        (src ? '<video controls width="360" src="' + src + '"></video>' : '') +
        '<div class="row">' +
        '<button class="ghost" onclick="download(\'/api/v1/videos/' + vid + '/export\', \'素材包.zip\').catch(e=>showErr(e.message))">下载素材包 ZIP</button>' +
        '<button class="ghost" onclick="download(\'/api/v1/videos/' + vid + '/file\', \'video.mp4\').catch(e=>showErr(e.message))">下载 MP4</button>' +
        '<button class="ghost" onclick="download(\'/api/v1/videos/' + vid + '/subtitle\', \'subtitle.srt\').catch(e=>showErr(e.message))">下载字幕</button>' +
        '</div>';
    } else if (v.status === 'failed') {
      $('videoArea').innerHTML = '<div class="risk">❌ 生成失败：' + (v.error_message || '未知错误') + '</div>' +
        '<button class="ghost" onclick="retryVideo(\'' + vid + '\')">重试</button>';
    } else {
      $('videoArea').innerHTML = '<div class="muted">任务状态：' + v.status + '（等待中…）</div>';
      setTimeout(() => pollVideo(vid), 3000);
    }
  } catch (e) { showErr(e.message); }
}

async function retryVideo(vid) {
  try { await api('/api/v1/videos/' + vid + '/retry', { method: 'POST' }); pollVideo(vid); } catch (e) { showErr(e.message); }
}

// ---------- 视频列表 ----------
async function refreshVideos() {
  const list = await api('/api/v1/videos');
  $('videoList').innerHTML = list.length ? '' : '<div class="muted">（暂无视频）</div>';
  for (const v of list) {
    const d = document.createElement('div');
    d.className = 'list-item';
    let body = '<b>视频 ' + v.id.slice(-6) + '</b> <span class="tag">' + v.status + '</span>';
    if (v.status === 'success') {
      let src = '';
      try { src = await mediaUrl('/api/v1/videos/' + v.id + '/file'); } catch (_) {}
      body += (src ? '<div><video controls width="300" src="' + src + '"></video></div>' : '') +
        '<div class="row">' +
        '<button class="ghost" onclick="download(\'/api/v1/videos/' + v.id + '/file\', \'video.mp4\').catch(e=>showErr(e.message))">下载 MP4</button>' +
        '<button class="ghost" onclick="download(\'/api/v1/videos/' + v.id + '/export\', \'素材包.zip\').catch(e=>showErr(e.message))">下载素材包</button>' +
        '</div>';
    } else if (v.status === 'failed') {
      body += '<div class="risk">' + (v.error_message || '生成失败') + '</div>';
    } else {
      body += '<div class="muted">生成中，请稍后刷新…</div>';
    }
    d.innerHTML = body;
    $('videoList').appendChild(d);
  }
}
$('btnVideos').onclick = () => { clearErr(); refreshVideos().catch(e => showErr(e.message)); };

// 启动：若已有 token 则直接进工作区
(async () => {
  if (token) {
    try { const me = await api('/api/v1/auth/me');
      $('loginCard').classList.add('hidden'); $('workspace').classList.remove('hidden');
      $('meInfo').textContent = '已登录：' + me.phone; await refreshProjects(); refreshVideos().catch(()=>{});
    } catch (e) { token = ''; localStorage.removeItem('avt_token'); }
  }
})();
</script>
</body>
</html>
