<svg xmlns="http://www.w3.org/2000/svg" width="320" height="466" viewBox="0 0 320 466" role="img"><title>AI PM Skill Evaluator</title><desc>A workflow for evaluating and improving AI product management Skills. It checks package structure, activation, process adherence, evidence, safety signals, deliverable quality, regression behavior, and measured efficiency.</desc><rect x="1" y="1" width="318" height="464" rx="8" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="16" y="44" font-size="28" font-weight="600" fill="#263c30">AI PM Skill</text><text x="16" y="78" font-size="28" font-weight="600" fill="#263c30">Evaluator</text><text x="16" y="120" font-size="22" fill="#5f7266">A workflow for</text><text x="16" y="148" font-size="22" fill="#5f7266">evaluating and improving</text><text x="16" y="176" font-size="22" fill="#5f7266">AI product management</text><text x="16" y="204" font-size="22" fill="#5f7266">Skills. It checks</text><text x="16" y="232" font-size="22" fill="#5f7266">package structure,</text><text x="16" y="260" font-size="22" fill="#5f7266">activation, process</text><text x="16" y="288" font-size="22" fill="#5f7266">adherence, evidence,</text><text x="16" y="316" font-size="22" fill="#5f7266">safety signals,</text><text x="16" y="344" font-size="22" fill="#5f7266">deliverable quality,</text><text x="16" y="372" font-size="22" fill="#5f7266">regression behavior, and</text><text x="16" y="400" font-size="22" fill="#5f7266">measured efficiency.</text><text x="16" y="444" font-size="21" fill="#1b6b4b">查看 Skill →</text></g></svg>