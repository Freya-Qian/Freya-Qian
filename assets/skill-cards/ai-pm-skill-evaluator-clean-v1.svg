<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" role="img"><title>AI PM Skill Evaluator</title><desc>A workflow for evaluating and improving AI product management Skills. It checks package structure, activation, process adherence, evidence, safety signals, deliverable quality, regression behavior, and measured efficiency.</desc><rect x="1" y="1" width="958" height="414" rx="12" fill="#ffffff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="48" y="90" fill="#263c30" font-size="50" font-weight="600">AI PM Skill Evaluator</text><text x="48" y="148" fill="#5f7266" font-size="30">A workflow for evaluating and improving AI product</text><text x="48" y="188" fill="#5f7266" font-size="30">management Skills. It checks package structure,</text><text x="48" y="228" fill="#5f7266" font-size="30">activation, process adherence, evidence, safety</text><text x="48" y="268" fill="#5f7266" font-size="30">signals, deliverable quality, regression behavior,</text><text x="48" y="308" fill="#5f7266" font-size="30">and measured efficiency.</text><text x="48" y="368" fill="#1b6b4b" font-size="26">查看 Skill</text></g><path d="M865 358 h36 l-10 -10 m10 10 -10 10" fill="none" stroke="#1b6b4b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>