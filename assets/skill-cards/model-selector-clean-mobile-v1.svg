<svg xmlns="http://www.w3.org/2000/svg" width="320" height="460" viewBox="0 0 320 460" role="img"><title>模型选型</title><desc>A provider-aware workflow for recommending three suitable models for a task, comparing current pricing and tradeoffs, and marking the most recommended option. Use it to choose among models; use 模型测评 to evaluate a specific model.</desc><rect x="1" y="1" width="318" height="458" rx="8" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="16" y="44" font-size="28" font-weight="600" fill="#263c30">模型选型</text><text x="16" y="86" font-size="22" fill="#5f7266">A provider-aware</text><text x="16" y="114" font-size="22" fill="#5f7266">workflow for</text><text x="16" y="142" font-size="22" fill="#5f7266">recommending three</text><text x="16" y="170" font-size="22" fill="#5f7266">suitable models for a</text><text x="16" y="198" font-size="22" fill="#5f7266">task, comparing current</text><text x="16" y="226" font-size="22" fill="#5f7266">pricing and tradeoffs,</text><text x="16" y="254" font-size="22" fill="#5f7266">and marking the most</text><text x="16" y="282" font-size="22" fill="#5f7266">recommended option. Use</text><text x="16" y="310" font-size="22" fill="#5f7266">it to choose among</text><text x="16" y="338" font-size="22" fill="#5f7266">models; use 模型测评 to</text><text x="16" y="366" font-size="22" fill="#5f7266">evaluate a specific</text><text x="16" y="394" font-size="22" fill="#5f7266">model.</text><text x="16" y="438" font-size="21" fill="#1b6b4b">查看 Skill →</text></g></svg>