<svg xmlns="http://www.w3.org/2000/svg" width="480" height="210" viewBox="0 0 480 210" role="img" aria-labelledby="title desc"><title id="title">24小时订单260万美元，具身智能最先卖爆的产品，长成了一只鸭子</title><desc id="desc">Embodied AI · Consumer Product。具身智能最早跑出来的爆款，可能不是最硬核的机器人，而是能被用户理解、喜欢并愿意付费的消费品。</desc><rect x="1" y="1" width="478" height="208" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="24" y="46" font-size="22" font-weight="600" fill="#263c30">24小时订单260万美元，具身智能最先卖</text><text x="24" y="75" font-size="22" font-weight="600" fill="#263c30">爆的产品，长成了一只鸭子</text><text x="24" y="99" font-size="15" font-weight="400" fill="#5f7266">Embodied AI · Consumer Product</text><text x="24" y="128" font-size="18" font-weight="400" fill="#5f7266">具身智能最早跑出来的爆款，可能不是最硬核的机器</text><text x="24" y="154" font-size="18" font-weight="400" fill="#5f7266">人，而是能被用户理解、喜欢并愿意付费的消费品。</text><text x="24" y="186" font-size="18" font-weight="400" fill="#1b6b4b">继续读</text><text x="434" y="186" font-size="22" font-weight="400" fill="#1b6b4b">→</text></g></svg>