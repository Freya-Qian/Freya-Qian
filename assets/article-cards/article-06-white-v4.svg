<svg xmlns="http://www.w3.org/2000/svg" width="960" height="166" viewBox="0 0 960 166" role="img" aria-labelledby="title desc"><title id="title">榜单第一离可用Agent还有多远，拆开MiniCPM5-2B的成绩单</title><desc id="desc">Evaluation · Agent Usability。榜单成绩回答的是模型在测试里表现如何，产品还要追问：它离真实可用、稳定交付和可控失败到底还有多远。</desc><rect x="1" y="1" width="958" height="164" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="36" y="57" font-size="21" font-weight="600" fill="#263c30">榜单第一离可用Agent还有多远，拆开MiniCPM5-2B的成绩单</text><text x="36" y="81" font-size="14" font-weight="400" fill="#5f7266">Evaluation · Agent Usability</text><text x="36" y="110" font-size="16" font-weight="400" fill="#5f7266">榜单成绩回答的是模型在测试里表现如何，产品还要追问：它离真实可用、稳定交付和可控失败到底还有多远。</text><text x="36" y="142" font-size="16" font-weight="400" fill="#1b6b4b">继续读</text><text x="902" y="142" font-size="22" font-weight="400" fill="#1b6b4b">→</text></g></svg>