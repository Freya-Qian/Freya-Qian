<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">多数Agent测试超过V4 Pro，DeepSeek V4.1 Flash赢在模型还是脚手架</title><desc id="desc">Benchmark · Product System。当 Agent 测试结果超过预期，问题就不只是模型强不强，也要拆开看脚手架、工具链和评测方式贡献了多少。</desc><rect x="1" y="1" width="958" height="308" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="40" y="74" font-size="34" font-weight="600" fill="#263c30">多数Agent测试超过V4 Pro，DeepSeek V4.1 Flash赢</text><text x="40" y="118" font-size="34" font-weight="600" fill="#263c30">在模型还是脚手架</text><text x="40" y="152" font-size="22" font-weight="400" fill="#5f7266">Benchmark · Product System</text><text x="40" y="194" font-size="26" font-weight="400" fill="#5f7266">当 Agent 测试结果超过预期，问题就不只是模型强不强，也要拆开看脚</text><text x="40" y="230" font-size="26" font-weight="400" fill="#5f7266">手架、工具链和评测方式贡献了多少。</text><text x="40" y="282" font-size="26" font-weight="400" fill="#1b6b4b">继续读</text><text x="894" y="282" font-size="26" font-weight="400" fill="#1b6b4b">→</text></g></svg>