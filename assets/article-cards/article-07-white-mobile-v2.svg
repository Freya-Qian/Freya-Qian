<svg xmlns="http://www.w3.org/2000/svg" width="480" height="348" viewBox="0 0 480 348" role="img" aria-labelledby="title desc"><title id="title">多数Agent测试超过V4 Pro，DeepSeek V4.1 Flash赢在模型还是脚手架</title><desc id="desc">Benchmark · Product System。当 Agent 测试结果超过预期，问题就不只是模型强不强，也要拆开看脚手架、工具链和评测方式贡献了多少。</desc><rect x="1" y="1" width="478" height="346" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="24" y="52" font-size="28" font-weight="600" fill="#263c30">多数Agent测试超过V4 Pro，De</text><text x="24" y="90" font-size="28" font-weight="600" fill="#263c30">epSeek V4.1 Flash赢在模型还</text><text x="24" y="128" font-size="28" font-weight="600" fill="#263c30">是脚手架</text><text x="24" y="162" font-size="20" font-weight="400" fill="#5f7266">Benchmark · Product System</text><text x="24" y="204" font-size="22" font-weight="400" fill="#5f7266">当 Agent 测试结果超过预期，问题就不</text><text x="24" y="236" font-size="22" font-weight="400" fill="#5f7266">只是模型强不强，也要拆开看脚手架、工</text><text x="24" y="268" font-size="22" font-weight="400" fill="#5f7266">具链和评测方式贡献了多少。</text><text x="24" y="320" font-size="22" font-weight="400" fill="#1b6b4b">继续读</text><text x="430" y="320" font-size="26" font-weight="400" fill="#1b6b4b">→</text></g></svg>