<svg xmlns="http://www.w3.org/2000/svg" width="480" height="348" viewBox="0 0 480 348" role="img" aria-labelledby="title desc"><title id="title">24小时订单260万美元，具身智能最先卖爆的产品，长成了一只鸭子</title><desc id="desc">Embodied AI · Consumer Product。具身智能最早跑出来的爆款，可能不是最硬核的机器人，而是能被用户理解、喜欢并愿意付费的消费品。</desc><rect x="1" y="1" width="478" height="346" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="24" y="52" font-size="28" font-weight="600" fill="#263c30">24小时订单260万美元，具身智</text><text x="24" y="90" font-size="28" font-weight="600" fill="#263c30">能最先卖爆的产品，长成了一只</text><text x="24" y="128" font-size="28" font-weight="600" fill="#263c30">鸭子</text><text x="24" y="162" font-size="20" font-weight="400" fill="#5f7266">Embodied AI · Consumer Product</text><text x="24" y="204" font-size="22" font-weight="400" fill="#5f7266">具身智能最早跑出来的爆款，可能不是最</text><text x="24" y="236" font-size="22" font-weight="400" fill="#5f7266">硬核的机器人，而是能被用户理解、喜欢</text><text x="24" y="268" font-size="22" font-weight="400" fill="#5f7266">并愿意付费的消费品。</text><text x="24" y="320" font-size="22" font-weight="400" fill="#1b6b4b">继续读</text><text x="430" y="320" font-size="26" font-weight="400" fill="#1b6b4b">→</text></g></svg>