<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-labelledby="title desc"><title id="title">24小时订单260万美元，具身智能最先卖爆的产品，长成了一只鸭子</title><desc id="desc">Embodied AI · Consumer Product。具身智能最早跑出来的爆款，可能不是最硬核的机器人，而是能被用户理解、喜欢并愿意付费的消费品。</desc><rect x="1" y="1" width="958" height="308" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="40" y="74" font-size="34" font-weight="600" fill="#263c30">24小时订单260万美元，具身智能最先卖爆的产品，长成</text><text x="40" y="118" font-size="34" font-weight="600" fill="#263c30">了一只鸭子</text><text x="40" y="152" font-size="22" font-weight="400" fill="#5f7266">Embodied AI · Consumer Product</text><text x="40" y="194" font-size="26" font-weight="400" fill="#5f7266">具身智能最早跑出来的爆款，可能不是最硬核的机器人，而是能被用户理</text><text x="40" y="230" font-size="26" font-weight="400" fill="#5f7266">解、喜欢并愿意付费的消费品。</text><text x="40" y="282" font-size="26" font-weight="400" fill="#1b6b4b">继续读</text><text x="894" y="282" font-size="26" font-weight="400" fill="#1b6b4b">→</text></g></svg>