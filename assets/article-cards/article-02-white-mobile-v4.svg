<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-labelledby="title desc"><title id="title">一部短剧没有演员，评论区却多了一群失恋的人</title><desc id="desc">AI Content · User Emotion。一部没有真人演员的短剧，依然让用户投入情绪。这里值得看的不是生成技术本身，而是 AI 内容如何触发真实的观看、投射和讨论。</desc><rect x="1" y="1" width="478" height="234" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="24" y="46" font-size="22" font-weight="600" fill="#263c30">一部短剧没有演员，评论区却多了一群失</text><text x="24" y="75" font-size="22" font-weight="600" fill="#263c30">恋的人</text><text x="24" y="99" font-size="15" font-weight="400" fill="#5f7266">AI Content · User Emotion</text><text x="24" y="128" font-size="18" font-weight="400" fill="#5f7266">一部没有真人演员的短剧，依然让用户投入情绪。这</text><text x="24" y="154" font-size="18" font-weight="400" fill="#5f7266">里值得看的不是生成技术本身，而是 AI 内容如何</text><text x="24" y="180" font-size="18" font-weight="400" fill="#5f7266">触发真实的观看、投射和讨论。</text><text x="24" y="212" font-size="18" font-weight="400" fill="#1b6b4b">继续读</text><text x="434" y="212" font-size="22" font-weight="400" fill="#1b6b4b">→</text></g></svg>