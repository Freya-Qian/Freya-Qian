<svg xmlns="http://www.w3.org/2000/svg" width="960" height="266" viewBox="0 0 960 266" role="img" aria-labelledby="title desc"><title id="title">AI提高效率以后，轻松为什么没有分到你手里</title><desc id="desc">Productivity · Work Design。AI 提高效率之后，轻松不一定自动回到个人手里。真正的问题是效率收益如何被组织、流程和角色重新分配。</desc><rect x="1" y="1" width="958" height="264" rx="12" fill="#fff" stroke="#d1d9e0"/><g font-family="-apple-system,PingFang SC,Arial,sans-serif"><text x="40" y="74" font-size="34" font-weight="600" fill="#263c30">AI提高效率以后，轻松为什么没有分到你手里</text><text x="40" y="108" font-size="22" font-weight="400" fill="#5f7266">Productivity · Work Design</text><text x="40" y="150" font-size="26" font-weight="400" fill="#5f7266">AI 提高效率之后，轻松不一定自动回到个人手里。真正的问题是效率收益</text><text x="40" y="186" font-size="26" font-weight="400" fill="#5f7266">如何被组织、流程和角色重新分配。</text><text x="40" y="238" font-size="26" font-weight="400" fill="#1b6b4b">继续读</text><text x="894" y="238" font-size="26" font-weight="400" fill="#1b6b4b">→</text></g></svg>